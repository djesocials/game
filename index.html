<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RUSH — Multiplayer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050611;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#menu{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#20266b 0,#0a0d21 42%,#04050c 100%)}
.card{width:min(440px,calc(100vw - 28px));padding:30px;border:1px solid #7380ff3b;border-radius:18px;background:#090c1dcc;box-shadow:0 25px 80px #000b;text-align:center}
.logo{font-size:46px;font-weight:1000;letter-spacing:-4px;background:linear-gradient(90deg,#5df5ff,#a86cff,#ff4f9a);-webkit-background-clip:text;color:transparent}
.sub{color:#aeb8d8;margin:4px 0 24px}
input{width:100%;padding:14px;border-radius:11px;border:1px solid #36406b;background:#070a17;color:white;font-size:16px;outline:none}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:11px;background:linear-gradient(90deg,#58edff,#9870ff);color:#06101a;font-weight:950;font-size:15px;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#err{display:none;margin-top:12px;padding:10px;border-radius:9px;background:#ff31551a;border:1px solid #ff315544;color:#ff9aab;font-size:12px;text-align:left}
.hint{font-size:11px;color:#687392;margin-top:15px;line-height:1.5}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:#080b19c9;border:1px solid #7380ff2d;border-radius:12px;backdrop-filter:blur(9px)}
#stats{position:absolute;top:14px;left:14px;padding:10px 14px}
#stats b{font-size:21px}#stats small{display:block;color:#8d98ba;margin-top:2px}
#leader{position:absolute;top:14px;right:14px;padding:9px 12px;width:205px}
#leader h3{margin:0 0 5px;color:#8490b5;font-size:11px;letter-spacing:1.5px}
.row{display:flex;justify-content:space-between;font-size:13px;line-height:20px}.me{color:#6ef5ff;font-weight:800}
#toast{position:absolute;top:90px;left:50%;transform:translateX(-50%);padding:9px 15px;opacity:0;transition:.2s;font-weight:800}
#controls{position:absolute;bottom:14px;left:14px;padding:8px 12px;color:#8993b3;font-size:12px}
@media(pointer:coarse){#controls{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
 <div id="stats" class="panel"><b id="score">0</b> PTS<small id="status">OFFLINE</small></div>
 <div id="leader" class="panel"><h3>TOP PLAYERS</h3><div id="board"></div></div>
 <div id="toast" class="panel"></div>
 <div id="controls" class="panel">WASD / ARROWS · AIM WITH MOUSE · CLICK SHOOT · SPACE DASH</div>
</div>

<div id="menu">
 <div class="card">
  <div class="logo">NEON RUSH</div>
  <div class="sub">Fast multiplayer arena combat.</div>
  <input id="name" maxlength="14" placeholder="Nickname" autocomplete="off">
  <button id="play">ENTER ARENA</button>
  <div id="err"></div>
  <div class="hint">Uses Firebase Anonymous Authentication + Realtime Database.</div>
 </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getDatabase,ref,set,update as dbUpdate,remove,onValue,onDisconnect,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyC_VF2KTDiX1WFZlNjBgSis3tDIbirVMOk",
 authDomain:"html-dcaa0.firebaseapp.com",
 databaseURL:"https://html-dcaa0-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"html-dcaa0",
 storageBucket:"html-dcaa0.firebasestorage.app",
 messagingSenderId:"780689116986",
 appId:"1:780689116986:web:7fe06c8e0285ef923f4a03",
 measurementId:"G-CB7P2NEHET"
};

window.addEventListener("error",e=>{ const el=document.getElementById("err"); if(el && !window.__neonStarted){el.style.display="block";el.textContent="Game script error: "+(e.message||"Unknown JavaScript error");} });
const $=id=>document.getElementById(id);
const menu=$("menu"),play=$("play"),nameInput=$("name"),err=$("err"),status=$("status"),scoreEl=$("score"),board=$("board");
const canvas=$("game"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=1;
let app,auth,db,uid=null;
let players={},bullets={},pickups={};
let started=false,score=0,streak=0,lastSend=0,lastShot=0,lastPickup=0;
const WORLD={w:2600,h:1700};
const keys={},mouse={x:innerWidth/2,y:innerHeight/2,down:false};
const colors=["#5df5ff","#b46cff","#ff4f9a","#ffd166","#66ff99","#ff795d","#8da2ff"];
const me={x:1300,y:850,vx:0,vy:0,a:0,hp:100,energy:100};

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")e.preventDefault()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("blur",()=>{for(const k in keys)keys[k]=false;mouse.down=false});
canvas.addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener("pointerdown",e=>{mouse.down=true});
addEventListener("pointerup",()=>mouse.down=false);
nameInput.addEventListener("keydown",e=>{if(e.key==="Enter")play.click()});

function showError(text){
 err.textContent=text;err.style.display="block";play.disabled=false;
}
function toast(text){const t=$("toast");t.textContent=text;t.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.opacity=0,1200)}
function colorFor(id){let n=0;for(const c of id)n=(n+c.charCodeAt(0))%colors.length;return colors[n]}
function spawn(){return{x:100+Math.random()*(WORLD.w-200),y:100+Math.random()*(WORLD.h-200)}}
function cleanName(){return (nameInput.value.trim().replace(/[<>]/g,"").slice(0,14)||"Player")}

async function enterArena(){
 if(started)return;
 err.style.display="none";
 const playerName=cleanName();
 play.disabled=true;play.textContent="CONNECTING…";
 status.textContent="CONNECTING…";

 try{
  // Initialize services only when the player presses the button.
  app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  db=getDatabase(app);

  const credential=await signInAnonymously(auth);
  uid=credential.user.uid;

  const pos=spawn();
  me.x=pos.x;me.y=pos.y;me.hp=100;me.energy=100;
  const playerRef=ref(db,"players/"+uid);

  await set(playerRef,{
   name:playerName,x:me.x,y:me.y,a:0,hp:100,score:0,streak:0,
   color:colorFor(uid),updated:serverTimestamp()
  });
  onDisconnect(playerRef).remove();

  onValue(ref(db,"players"),snap=>{
   players=snap.val()||{};
   updateLeaderboard();
   status.textContent="LIVE · "+Object.keys(players).length+" ONLINE";
  },e=>showError("Players database error: "+e.message));

  onValue(ref(db,"bullets"),snap=>{bullets=snap.val()||{}});
  onValue(ref(db,"pickups"),snap=>{pickups=snap.val()||{}});

  started=true;
  menu.style.display="none";
  toast("WELCOME, "+playerName.toUpperCase());
 }catch(e){
  console.error(e);
  let message=e?.message||String(e);
  if(e?.code==="auth/operation-not-allowed")
   message="Anonymous Authentication is disabled. Firebase Console → Authentication → Sign-in method → Anonymous → Enable.";
  else if(e?.code==="auth/network-request-failed")
   message="Firebase network request failed. Check your connection and that this page is served over HTTP/HTTPS.";
  else if(e?.code==="PERMISSION_DENIED")
   message="Realtime Database permission denied. Update your Firebase Database Rules.";
  showError(message);
  status.textContent="CONNECTION FAILED";
  play.textContent="ENTER ARENA";
 }
}
play.addEventListener("click",enterArena);

function updateLeaderboard(){
 const arr=Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0)).slice(0,7);
 board.innerHTML=arr.map(([id,p],i)=>`<div class="row ${id===uid?"me":""}"><span>${i+1}. ${escapeHtml(p.name||"Player")}</span><b>${p.score||0}</b></div>`).join("");
 if(uid&&players[uid]){score=players[uid].score||0;scoreEl.textContent=score}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function syncPlayer(){
 if(!uid||!db)return;
 const now=performance.now();if(now-lastSend<70)return;lastSend=now;
 try{
  await dbUpdate(ref(db,"players/"+uid),{
   x:Math.round(me.x),y:Math.round(me.y),a:me.a,hp:Math.round(me.hp),
   score,streak,updated:serverTimestamp()
  });
 }catch(e){console.warn("sync",e)}
}
async function shoot(){
 if(!uid||!db)return;
 const now=performance.now();if(now-lastShot<170)return;lastShot=now;
 const id=uid+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
 await set(ref(db,"bullets/"+id),{
  x:me.x+Math.cos(me.a)*30,y:me.y+Math.sin(me.a)*30,
  vx:Math.cos(me.a)*900,vy:Math.sin(me.a)*900,owner:uid,
  created:serverTimestamp()
 });
 setTimeout(()=>remove(ref(db,"bullets/"+id)).catch(()=>{}),1200);
}
let dashLock=false;
function dash(){
 if(me.energy<35)return;
 me.energy-=35;
 me.x=Math.max(35,Math.min(WORLD.w-35,me.x+Math.cos(me.a)*210));
 me.y=Math.max(35,Math.min(WORLD.h-35,me.y+Math.sin(me.a)*210));
 toast("⚡ DASH");
}

function update(dt){
 let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 const l=Math.hypot(x,y)||1;x/=l;y/=l;
 me.vx+=(x*1100-me.vx)*Math.min(1,dt*8);
 me.vy+=(y*1100-me.vy)*Math.min(1,dt*8);
 if(!x&&!y){me.vx*=.86;me.vy*=.86}
 me.x=Math.max(35,Math.min(WORLD.w-35,me.x+me.vx*dt));
 me.y=Math.max(35,Math.min(WORLD.h-35,me.y+me.vy*dt));
 me.energy=Math.min(100,me.energy+dt*17);
 me.a=Math.atan2(mouse.y-H/2,mouse.x-W/2);
 if(mouse.down)shoot();
 if(keys[" "]&&!dashLock){dashLock=true;dash()}else if(!keys[" "])dashLock=false;
}

function w2s(x,y){return[x-me.x+W/2,y-me.y+H/2]}
function draw(){
 ctx.fillStyle="#050611";ctx.fillRect(0,0,W,H);
 const g=80,ox=((W/2-me.x)%g+g)%g,oy=((H/2-me.y)%g+g)%g;
 ctx.strokeStyle="#151c39";ctx.lineWidth=1;ctx.beginPath();
 for(let x=ox;x<W;x+=g){ctx.moveTo(x,0);ctx.lineTo(x,H)}
 for(let y=oy;y<H;y+=g){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();

 const [bx,by]=w2s(0,0);ctx.strokeStyle="#33427a";ctx.lineWidth=5;ctx.strokeRect(bx,by,WORLD.w,WORLD.h);

 for(const p of Object.values(pickups))drawPickup(p);
 for(const b of Object.values(bullets))drawBullet(b);
 for(const [id,p] of Object.entries(players))if(id!==uid)drawPlayer(id,p);
 if(started)drawPlayer(uid,{...me,name:cleanName(),color:colorFor(uid)});
}
function drawPickup(p){
 const [x,y]=w2s(p.x,p.y);if(x<-30||x>W+30||y<-30||y>H+30)return;
 const c=p.kind==="energy"?"#65ffb0":"#ffd166",s=1+Math.sin(performance.now()/150+p.x)*.12;
 ctx.save();ctx.translate(x,y);ctx.rotate(performance.now()/700);ctx.shadowBlur=22;ctx.shadowColor=c;ctx.fillStyle=c;ctx.fillRect(-9*s,-9*s,18*s,18*s);ctx.restore();
}
function drawBullet(b){
 const [x,y]=w2s(b.x,b.y);ctx.fillStyle=b.owner===uid?"#fff":"#ff4f9a";ctx.shadowBlur=14;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();ctx.shadowBlur=0;
}
function drawPlayer(id,p){
 if(!p||typeof p.x!=="number")return;
 const [x,y]=w2s(p.x,p.y);if(x<-60||x>W+60||y<-60||y>H+60)return;
 const c=p.color||colorFor(id);
 ctx.save();ctx.translate(x,y);ctx.rotate(p.a||0);ctx.shadowBlur=20;ctx.shadowColor=c;ctx.fillStyle=c;
 ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(29,0);ctx.lineTo(4,-8);ctx.lineTo(4,8);ctx.closePath();ctx.fill();ctx.restore();
 ctx.textAlign="center";ctx.font="700 11px system-ui";ctx.fillStyle="#fff";ctx.fillText(p.name||"Player",x,y-29);
 ctx.fillStyle="#151a2d";ctx.fillRect(x-20,y+24,40,4);ctx.fillStyle="#5dff8b";ctx.fillRect(x-20,y+24,40*Math.max(0,Math.min(1,(p.hp??100)/100)),4);
}

function collision(){
 if(!uid)return;
 for(const [id,b] of Object.entries(bullets)){
  if(b.owner!==uid&&Math.hypot(b.x-me.x,b.y-me.y)<25){
   remove(ref(db,"bullets/"+id)).catch(()=>{});
   me.hp-=18;streak=0;
   if(me.hp<=0){score=Math.max(0,score-50);me.hp=100;Object.assign(me,spawn());toast("💥 ELIMINATED · -50")}
  }
 }
 for(const [id,p] of Object.entries(pickups)){
  if(Math.hypot(p.x-me.x,p.y-me.y)<35){
   remove(ref(db,"pickups/"+id)).catch(()=>{});
   if(p.kind==="energy"){me.energy=100;score+=25;toast("+25 ENERGY")}
   else{me.hp=Math.min(100,me.hp+40);score+=20;toast("+20 HEALTH")}
  }
 }
}
async function spawnPickups(){
 if(!uid||performance.now()-lastPickup<5000)return;lastPickup=performance.now();
 if(Object.keys(pickups).length<5){
  const p=spawn(),kind=Math.random()<.55?"energy":"heal";
  await set(ref(db,"pickups/"+uid+"_"+Date.now()),{x:p.x,y:p.y,kind});
 }
}

let last=performance.now();
function loop(t){
 const dt=Math.min(.033,(t-last)/1000);last=t;
 if(started){update(dt);collision();spawnPickups();syncPlayer();
  for(const b of Object.values(bullets)){b.x+=(b.vx||0)*dt;b.y+=(b.vy||0)*dt}
 }
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
