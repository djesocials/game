<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON RUSH — Firebase Multiplayer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070812;color:#fff;font-family:Inter,system-ui,Segoe UI,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(8,10,24,.78);border:1px solid rgba(120,150,255,.25);backdrop-filter:blur(10px);box-shadow:0 8px 35px #0007;border-radius:14px}
#top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#stats{padding:10px 14px;min-width:185px}
#stats b{font-size:20px}#stats small{display:block;color:#9da8c8;margin-top:2px}
#leader{padding:9px 12px;min-width:175px;max-width:240px}
#leader h3{margin:0 0 5px;font-size:12px;letter-spacing:1.5px;color:#8e9bc2}
.row{display:flex;justify-content:space-between;font-size:13px;line-height:20px}.me{color:#7cf7ff;font-weight:800}
#toast{position:absolute;top:92px;left:50%;transform:translateX(-50%);padding:9px 15px;opacity:0;transition:.2s;color:#fff;font-weight:700}
#bottom{position:absolute;bottom:14px;left:14px;padding:8px 12px;color:#9da8c8;font-size:12px}
#join{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#18205b 0,#090b1a 42%,#05060d 100%);z-index:10}
.card{width:min(440px,calc(100vw - 30px));padding:28px;text-align:center}
.logo{font-size:42px;font-weight:950;letter-spacing:-3px;background:linear-gradient(90deg,#70f7ff,#b66cff,#ff4f9a);-webkit-background-clip:text;color:transparent}
.tag{color:#aab4d2;margin:3px 0 22px}
input,button{font:inherit}input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #35406e;background:#0b0e20;color:#fff;outline:none}
button{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,#4be8ff,#8c6cff);color:#07101c;font-weight:900;cursor:pointer}
.hint{font-size:11px;color:#6f7898;margin-top:15px;line-height:1.5}
#mobile{display:none;position:absolute;inset:0}
#stick{position:absolute;bottom:42px;left:35px;width:125px;height:125px;border:2px solid #ffffff22;border-radius:50%;background:#ffffff08}
#knob{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#75efff99;box-shadow:0 0 25px #4be8ff66}
#fire{position:absolute;right:30px;bottom:48px;width:105px;height:105px;border-radius:50%;background:#ff4f9a55;border:2px solid #ff8fbb66;display:grid;place-items:center;font-weight:900}
@media(pointer:coarse){#mobile{display:block}#bottom{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="top">
    <div id="stats" class="panel"><b id="score">0</b> <span>PTS</span><small id="status">Connecting…</small></div>
    <div id="leader" class="panel"><h3>TOP PLAYERS</h3><div id="board"></div></div>
  </div>
  <div id="toast" class="panel"></div>
  <div id="bottom" class="panel">WASD / ARROWS move · MOUSE aim · CLICK shoot · SPACE dash</div>
  <div id="mobile"><div id="stick"><div id="knob"></div></div><div id="fire">FIRE</div></div>
</div>

<div id="join">
  <div class="card panel">
    <div class="logo">NEON RUSH</div>
    <div class="tag">A tiny multiplayer arena where every second matters.</div>
    <input id="name" maxlength="14" placeholder="Enter your nickname" autocomplete="off">
    <button id="play">ENTER ARENA</button>
    <div class="hint">Anonymous Firebase login · live multiplayer · pickups · streaks · dash combat</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getDatabase, ref, set, update, remove, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyC_VF2KTDiX1WFZlNjBgSis3tDIbirVMOk",
  authDomain:"html-dcaa0.firebaseapp.com",
  databaseURL:"https://html-dcaa0-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"html-dcaa0",
  storageBucket:"html-dcaa0.firebasestorage.app",
  messagingSenderId:"780689116986",
  appId:"1:780689116986:web:7fe06c8e0285ef923f4a03",
  measurementId:"G-CB7P2NEHET"
};
const app=initializeApp(firebaseConfig), db=getDatabase(app), auth=getAuth(app);
const cvs=document.getElementById("game"),ctx=cvs.getContext("2d");
const scoreEl=document.getElementById("score"),statusEl=document.getElementById("status"),board=document.getElementById("board");
const join=document.getElementById("join"),nameInput=document.getElementById("name"),play=document.getElementById("play"),toast=document.getElementById("toast");
let W,H,dpr=1,uid=null,players={},bullets={},pickups={},myName="",score=0,streak=0,lastShot=0,lastSend=0,lastFrame=0;
let me={x:0,y:0,vx:0,vy:0,a:0,hp:100,energy:100};
const keys={},mouse={x:0,y:0,down:false};
const WORLD={w:2600,h:1700};
const colors=["#5df5ff","#b46cff","#ff4f9a","#ffd166","#66ff99","#ff795d","#8da2ff"];

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cvs.width=W*dpr;cvs.height=H*dpr;cvs.style.width=W+"px";cvs.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code==="Space")e.preventDefault()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
cvs.addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
cvs.addEventListener("pointerdown",e=>{mouse.down=true});
addEventListener("pointerup",()=>mouse.down=false);

function msg(t){toast.textContent=t;toast.style.opacity=1;clearTimeout(msg.t);msg.t=setTimeout(()=>toast.style.opacity=0,1300)}
function spawn(){return {x:180+Math.random()*(WORLD.w-360),y:180+Math.random()*(WORLD.h-360)}}
function safeName(){return (nameInput.value.trim().replace(/[<>]/g,"").slice(0,14)||"Player")}
function colorFor(id){let n=0;for(let c of id)n=(n+c.charCodeAt(0))%colors.length;return colors[n]}

async function start(){
  myName=safeName(); play.disabled=true;
  try{
    const cred=await signInAnonymously(auth); uid=cred.user.uid;
    const p=spawn();
    me={...me,...p,a:0,hp:100,energy:100};
    const pRef=ref(db,"players/"+uid);
    await set(pRef,{name:myName,x:me.x,y:me.y,a:0,hp:100,score:0,streak:0,color:colorFor(uid),updated:serverTimestamp()});
    onDisconnect(pRef).remove();
    onValue(ref(db,"players"),s=>{players=s.val()||{};renderBoard()});
    onValue(ref(db,"bullets"),s=>{bullets=s.val()||{}});
    onValue(ref(db,"pickups"),s=>{pickups=s.val()||{}});
    join.style.display="none"; statusEl.textContent="LIVE · "+Object.keys(players).length+" online";
    msg("You're in. Get a streak going!");
  }catch(e){
    console.error(e); statusEl.textContent="Firebase connection failed";
    msg("Enable Anonymous Auth + Realtime Database rules in Firebase.");
    play.disabled=false;
  }
}
play.onclick=start;nameInput.addEventListener("keydown",e=>{if(e.key==="Enter")start()});

function renderBoard(){
 const arr=Object.entries(players).sort((a,b)=>(b[1].score||0)-(a[1].score||0)).slice(0,6);
 board.innerHTML=arr.map(([id,p],i)=>`<div class="row ${id===uid?"me":""}"><span>${i+1}. ${escapeHtml(p.name||"Player")}</span><b>${p.score||0}</b></div>`).join("");
 if(uid&&players[uid]){score=players[uid].score||0;scoreEl.textContent=score;statusEl.textContent="LIVE · "+Object.keys(players).length+" online"}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function sendPlayer(){
 if(!uid)return;
 const now=performance.now(); if(now-lastSend<55)return; lastSend=now;
 await update(ref(db,"players/"+uid),{x:Math.round(me.x),y:Math.round(me.y),a:me.a,hp:Math.round(me.hp),score,streak,updated:serverTimestamp()});
}
async function shoot(){
 const now=performance.now();if(now-lastShot<180||!uid)return;lastShot=now;
 const speed=900, id=uid+"_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
 const b={x:me.x+Math.cos(me.a)*28,y:me.y+Math.sin(me.a)*28,vx:Math.cos(me.a)*speed,vy:Math.sin(me.a)*speed,owner:uid,t:serverTimestamp()};
 await set(ref(db,"bullets/"+id),b);
 setTimeout(()=>remove(ref(db,"bullets/"+id)),1100);
}
async function dash(){
 if(me.energy<35)return; me.energy-=35;
 const d=190, dx=Math.cos(me.a),dy=Math.sin(me.a);me.x=Math.max(40,Math.min(WORLD.w-40,me.x+dx*d));me.y=Math.max(40,Math.min(WORLD.h-40,me.y+dy*d));
 msg("DASH!");
}
let dashLock=false;
function input(){
 let x=(keys["d"]||keys["arrowright"]?1:0)-(keys["a"]||keys["arrowleft"]?1:0);
 let y=(keys["s"]||keys["arrowdown"]?1:0)-(keys["w"]||keys["arrowup"]?1:0);
 const len=Math.hypot(x,y)||1;x/=len;y/=len;
 const accel=1050,dt=.016;
 me.vx+=(x*accel-me.vx)*Math.min(1,dt*7);me.vy+=(y*accel-me.vy)*Math.min(1,dt*7);
 if(!x&&!y){me.vx*=.88;me.vy*=.88}
 me.x=Math.max(35,Math.min(WORLD.w-35,me.x+me.vx*dt));me.y=Math.max(35,Math.min(WORLD.h-35,me.y+me.vy*dt));
 me.energy=Math.min(100,me.energy+dt*15);
 me.a=Math.atan2(mouse.y-H/2,mouse.x-W/2);
 if(mouse.down)shoot();
 if(keys[" "]&&!dashLock){dashLock=true;dash()} if(!keys[" "])dashLock=false;
}
function worldToScreen(x,y){return [x-me.x+W/2,y-me.y+H/2]}

function drawGrid(){
 ctx.fillStyle="#070812";ctx.fillRect(0,0,W,H);
 const grid=80, ox=((W/2-me.x)%grid+grid)%grid,oy=((H/2-me.y)%grid+grid)%grid;
 ctx.strokeStyle="#182044";ctx.lineWidth=1;ctx.beginPath();
 for(let x=ox;x<W;x+=grid){ctx.moveTo(x,0);ctx.lineTo(x,H)}
 for(let y=oy;y<H;y+=grid){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
 // world boundary
 const [bx,by]=worldToScreen(0,0);ctx.strokeStyle="#32437a";ctx.lineWidth=5;ctx.strokeRect(bx,by,WORLD.w,WORLD.h);
 // decorative arena lights
 for(let x=200;x<WORLD.w;x+=400)for(let y=200;y<WORLD.h;y+=400){
   const [sx,sy]=worldToScreen(x,y); if(sx>-50&&sx<W+50&&sy>-50&&sy<H+50){ctx.fillStyle="#293c7822";ctx.beginPath();ctx.arc(sx,sy,90,0,7);ctx.fill()}
 }
}
function drawPickup(p){
 const [x,y]=worldToScreen(p.x,p.y); if(x<-40||x>W+40||y<-40||y>H+40)return;
 const pulse=1+Math.sin(performance.now()/180+p.x)*.12;
 ctx.save();ctx.translate(x,y);ctx.rotate(performance.now()/1000);
 ctx.shadowBlur=22;ctx.shadowColor=p.kind==="energy"?"#62ffae":"#ffd166";ctx.fillStyle=p.kind==="energy"?"#62ffae":"#ffd166";
 ctx.fillRect(-9*pulse,-9*pulse,18*pulse,18*pulse);ctx.restore();
}
function drawPlayer(id,p){
 const [x,y]=worldToScreen(p.x,p.y);if(x<-70||x>W+70||y<-70||y>H+70)return;
 const c=p.color||colorFor(id);ctx.save();ctx.translate(x,y);ctx.rotate(p.a||0);
 ctx.shadowBlur=20;ctx.shadowColor=c;ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();
 ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(28,0);ctx.lineTo(4,-7);ctx.lineTo(4,7);ctx.closePath();ctx.fill();
 ctx.restore();
 ctx.fillStyle="#ffffffcc";ctx.textAlign="center";ctx.font="700 11px system-ui";ctx.fillText(p.name||"Player",x,y-30);
 ctx.fillStyle="#151a2d";ctx.fillRect(x-20,y+25,40,4);ctx.fillStyle="#5dff8b";ctx.fillRect(x-20,y+25,40*Math.max(0,(p.hp??100)/100),4);
}
function drawBullet(b){
 const [x,y]=worldToScreen(b.x,b.y);ctx.fillStyle=b.owner===uid?"#fff":"#ff5eaa";ctx.shadowBlur=14;ctx.shadowColor=ctx.fillStyle;ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();ctx.shadowBlur=0;
}
function collisionLoop(){
 if(!uid)return;
 for(const [id,b] of Object.entries(bullets)){
   if(b.owner===uid)continue;
   if(Math.hypot(b.x-me.x,b.y-me.y)<25){
     me.hp-=18; remove(ref(db,"bullets/"+id)); streak=0;
     if(me.hp<=0){score=Math.max(0,score-50);streak=0;me.hp=100;Object.assign(me,spawn());msg("💥 You got eliminated — -50");}
   }
 }
 for(const [id,p] of Object.entries(pickups)){
   if(Math.hypot(p.x-me.x,p.y-me.y)<35){
     remove(ref(db,"pickups/"+id));
     if(p.kind==="energy"){me.energy=100;score+=25;msg("+25 ENERGY")}
     else {me.hp=Math.min(100,me.hp+40);score+=20;msg("+20 MEDKIT")}
   }
 }
}
let pickupTimer=0;
async function maybePickup(t){
 if(!uid||t-pickupTimer<5000)return;pickupTimer=t;
 if(Object.keys(pickups).length<5){
   const p=spawn(),kind=Math.random()<.55?"energy":"heal";
   await set(ref(db,"pickups/"+uid+"_"+Date.now()),{x:p.x,y:p.y,kind});
 }
}
function frame(t){
 const dt=Math.min(.033,(t-lastFrame)/1000||.016);lastFrame=t;
 if(uid){
   input();collisionLoop();maybePickup(t);sendPlayer();
 }
 drawGrid();
 for(const p of Object.values(pickups))drawPickup(p);
 for(const b of Object.values(bullets)){b.x+=(b.vx||0)*dt;b.y+=(b.vy||0)*dt;drawBullet(b)}
 for(const [id,p] of Object.entries(players))if(id!==uid)drawPlayer(id,p);
 if(uid)drawPlayer(uid,{...me,name:myName,color:colorFor(uid)});
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
